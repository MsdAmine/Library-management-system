spring.application.name=library-management-system

# 1. DATABASE CONNECTION
# This creates the schema 'library_db' if it doesn't exist
spring.datasource.url=jdbc:mysql://localhost:3306/library_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 2. HIBERNATE & FLYWAY SETTINGS
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.locations=classpath:db/migration

# 3. SCHEDULER SETTINGS
# Cron for overdue borrowing sweep (default: daily at 1:00 AM)
app.scheduler.overdue-sweep.cron=0 0 1 * * ?
# Cron for expired hold reservation sweep (default: every 15 minutes)
app.scheduler.expiry-sweep.cron=0 */15 * * * ?